# =============================================================================
#  FARZIN — lokal ishlab chiqish muhiti
#  Ishga tushirish:  docker compose up -d
#  Spetsifikatsiya:  docs/11-infrastructure.md §3
# =============================================================================

name: farzin

services:
  postgres:
    image: postgres:17-alpine
    container_name: farzin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: farzin
      POSTGRES_PASSWORD: farzin_dev_only
      POSTGRES_DB: farzin
      # Determinizm uchun: barcha muhitlarda bir xil collation.
      # Aks holda ORDER BY natijasi platformaga qarab farq qiladi.
      POSTGRES_INITDB_ARGS: '--locale=C.UTF-8 --encoding=UTF8'
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U farzin -d farzin']
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      # Dev'da sekin so'rovlarni ko'rish uchun
      - -c
      - log_min_duration_statement=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100

  redis:
    image: redis:7-alpine
    container_name: farzin-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    # AOF yoqilgan — faol o'yin taymeri Redis'da saqlanadi.
    # Sabab va trade-off: docs/adr/0002-postgres-primary-store.md
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-mos object storage (avatar, PGN arxiv, hisobot)
  minio:
    image: minio/minio:latest
    container_name: farzin-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: farzin
      MINIO_ROOT_PASSWORD: farzin_dev_only
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Dev'da email tutib qolish — haqiqiy email yuborilmaydi
  mailpit:
    image: axllent/mailpit:latest
    container_name: farzin-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    environment:
      MP_MAX_MESSAGES: 500

  # ===========================================================================
  #  ILOVA — Faza 0 DoD: "git clone → docker compose up → ishlaydigan API,
  #  hech qanday qo'lda qadam yo'q" (docs/14-roadmap.md).
  #
  #  Ilgari bu fayl FAQAT infratuzilmani ko'tarardi va DoD bajarilmasdi
  #  (docs/AUDIT.md JIDDIY-11). Endi uch xizmat qo'shildi:
  #    migrate — bir martalik migratsiya, app'dan OLDIN tugaydi
  #    app     — API (Dockerfile `runner` target)
  #    worker  — BullMQ + Stockfish (Dockerfile `worker` target)
  # ===========================================================================

  # --- Migratsiya: bir marta ishlaydi va TUGAYDI -----------------------------
  #  Nega alohida xizmat: `prisma migrate deploy` ni app entrypoint'iga
  #  qo'shish ko'p replikada poyga holatiga olib keladi (ikki pod bir vaqtda
  #  migratsiya qiladi). Alohida bir martalik qadam — docs/11 §8 expand-
  #  contract oqimining birinchi bosqichi.
  #
  #  ⚠️  BOSQICH TANLOVI: `runner` ham, `builder` ham YARAMAYDI — ikkalasida
  #      `pnpm prune --prod` bajarilgan va `node_modules/.bin/prisma`
  #      symlink'i o'chgan (tekshirildi: "prisma: not found").
  #      `deps` bosqichida esa to'liq node_modules va `prisma/schema.prisma`
  #      bor. `migrate deploy` uchun generatsiya qilingan klient kerak emas —
  #      faqat CLI, schema va DATABASE_URL.
  migrate:
    build:
      context: .
      target: deps
    container_name: farzin-migrate
    restart: 'no'
    command: ['pnpm', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://farzin:farzin_dev_only@postgres:5432/farzin?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    image: farzin:api
    container_name: farzin-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment: &app_env
      # Bu fayl LOKAL ISHLAB CHIQISH muhiti (sarlavhaga qarang), shuning
      # uchun `development`. Bu Swagger UI'ni /api/docs da ochadi —
      # main.ts prod'da uni ATAYLAB o'chiradi (API sirtini oshkor qilmaslik
      # uchun). Image'ning o'zida `ENV NODE_ENV=production` turadi, ya'ni
      # prod deploy'da bu qator berilmasa xavfsiz default kuchda qoladi.
      NODE_ENV: development
      PORT: '3000'
      API_PREFIX: api
      DATABASE_URL: postgresql://farzin:farzin_dev_only@postgres:5432/farzin?schema=public
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # ⚠️  FAQAT LOKAL DEV. Prod'da bu qiymatlar sirlar boshqaruvidan
      #     keladi. configuration.ts prod'da shablon/zaif kalitni
      #     (CHANGE_ME, secret, password) RAD ETADI — quyidagilar shu
      #     ro'yxatga tushmaydigan, lekin ochiq-oydin dev qiymatlar.
      JWT_ACCESS_SECRET: farzin-dev-only-access-key-do-not-use-in-prod-0001
      JWT_REFRESH_SECRET: farzin-dev-only-refresh-key-do-not-use-in-prod-0002
      # Dev'da email mailpit'ga tushadi (web UI: http://localhost:8025)
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_FROM: no-reply@farzin.uz
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Migratsiya TUGAGANDAN keyin — aks holda app yo'q jadvalga uriladi.
      migrate:
        condition: service_completed_successfully

  # --- Worker: fairplay navbati (Stockfish shu image'da) ---------------------
  #  HTTP server ochmaydi (worker.ts: createApplicationContext), shuning
  #  uchun port ham, healthcheck ham yo'q.
  worker:
    build:
      context: .
      target: worker
    image: farzin:worker
    container_name: farzin-worker
    restart: unless-stopped
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --- Kuzatuv (ixtiyoriy: docker compose --profile observability up) ------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: farzin-jaeger
    profiles: ['observability']
    ports:
      - '16686:16686' # UI
      - '4318:4318' # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'

  prometheus:
    image: prom/prometheus:latest
    container_name: farzin-prometheus
    profiles: ['observability']
    ports:
      - '9090:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alert va recording qoidalari. prometheus.yml dagi
      # `rule_files: /etc/prometheus/rules/*.yml` aynan shu papkani o'qiydi.
      - ./infra/prometheus:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    # `host.docker.internal` Linux'da default'da yo'q — HOST'da ishlayotgan
    # API'ni scrape qilish uchun kerak (prometheus.yml farzin-api job'i).
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana:latest
    container_name: farzin-grafana
    profiles: ['observability']
    ports:
      - '3009:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: farzin_dev_only
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
